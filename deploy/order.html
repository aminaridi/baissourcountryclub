<style>
:root{
  --ground:#F4F3EE;--panel:#FFFFFF;--panel-2:#EBEAE3;--line:#D9D8D0;
  --ink:#2E2E30;--ink-2:#58585B;--ink-3:#77776F;
  --lime:#8DC63F;--lime-ink:#1F3308;--lime-soft:#E6F2D2;--oak:#C9A56A;--red:#C63D30;
  --shadow:0 6px 24px rgba(46,46,48,.10);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#1E1E20;--panel:#2A2A2D;--panel-2:#333336;--line:#45454A;
  --ink:#F4F3EE;--ink-2:#C9C9C4;--ink-3:#9A9A94;
  --lime:#9BD44C;--lime-ink:#16260A;--lime-soft:#2F3F1C;--oak:#D4B47C;--red:#E56A5E;
  --shadow:0 6px 24px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --ground:#1E1E20;--panel:#2A2A2D;--panel-2:#333336;--line:#45454A;
  --ink:#F4F3EE;--ink-2:#C9C9C4;--ink-3:#9A9A94;
  --lime:#9BD44C;--lime-ink:#16260A;--lime-soft:#2F3F1C;--oak:#D4B47C;--red:#E56A5E;
  --shadow:0 6px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ground);color:var(--ink);font-family:'Rubik','Helvetica Neue',Arial,sans-serif;font-size:15px;line-height:1.45}
[data-lang="ar"] body{font-family:'Almarai','Rubik',sans-serif}
h1,h2,h3,.disp{font-family:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif;letter-spacing:-.02em;margin:0}
[data-lang="ar"] h1,[data-lang="ar"] h2,[data-lang="ar"] h3{font-family:'Almarai',sans-serif;letter-spacing:0;font-weight:800}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
a{color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:#2E2E30;color:#F4F3EE;display:flex;align-items:center;gap:12px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#F4F3EE}
.brand .disp{font-size:20px;font-weight:800}
.brand .disp span{color:#8DC63F}
.top .back{margin-inline-start:auto;color:#D9D8D0;font-size:14px;text-decoration:none;white-space:nowrap}
.top .back:hover{color:#fff;text-decoration:underline}
.lang{background:rgba(255,255,255,.1);color:#F4F3EE;padding:7px 12px;font-weight:600;font-size:14px}

/* hero */
.hero{background:#2E2E30;color:#F4F3EE;padding:18px 0 26px}
.hero .in{max-width:1180px;margin:0 auto;padding:0 16px}
.hero .sign{font-family:'Almarai',sans-serif;font-weight:800;color:#8DC63F;font-size:15px}
.hero h1{font-size:clamp(28px,5vw,44px);font-weight:800;margin-top:4px;color:#F4F3EE}
.hero p{margin:8px 0 0;color:#D9D8D0;max-width:62ch}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pills span{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:5px 12px;font-size:13px;color:#F4F3EE}

/* layout */
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 130px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px}
.cats{position:sticky;top:56px;z-index:10;background:var(--ground);display:flex;gap:6px;overflow-x:auto;padding:12px 0;grid-column:1/-1;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{white-space:nowrap;background:var(--panel);color:var(--ink-2);padding:8px 14px;border:1px solid var(--line);border-radius:999px;font-weight:500}
.cats button[aria-current="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink);font-weight:600}
.section{margin-bottom:28px;scroll-margin-top:118px}
.section h2{font-size:22px;font-weight:800;margin-bottom:4px}
.section h2 small{font-family:'Almarai',sans-serif;font-weight:700;color:var(--ink-3);font-size:15px;margin-inline-start:6px}
.section .sub{color:var(--ink-3);font-size:13px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:10px}
.item{background:var(--panel);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line)}
.item.sig{border-color:var(--lime);box-shadow:inset 0 0 0 1px var(--lime)}
.item .name{font-weight:600}
.item .alt{color:var(--ink-3);font-size:13px}
.item .desc{color:var(--ink-2);font-size:13px}
.item .row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:6px}
.price{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:18px}
.tag{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--lime-soft);color:var(--lime-ink);white-space:nowrap}
.tag.lean{background:var(--panel-2);color:var(--ink-2)}
[data-lang="ar"] .tag{letter-spacing:0}
.add{background:var(--ink);color:var(--ground);padding:8px 14px;font-weight:600}
.add:hover{background:var(--lime);color:var(--lime-ink)}
.kcal{color:var(--ink-3);font-size:12px}

/* cart */
.cart{position:sticky;top:120px;align-self:start;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 136px);overflow:auto}
.cart h2{font-size:20px;font-weight:800}
.lines{display:flex;flex-direction:column;gap:10px}
.line{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:start;font-size:14px}
.line small{display:block;color:var(--ink-3)}
.qty{display:inline-flex;align-items:center;gap:6px}
.qty button{width:28px;height:28px;border-radius:8px;background:var(--panel-2);color:var(--ink);font-weight:700}
.totals{border-top:1px solid var(--line);padding-top:8px;display:grid;gap:4px;font-size:14px}
.totals div{display:flex;justify-content:space-between}
.totals .grand{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:20px}
.primary{background:var(--lime);color:var(--lime-ink);padding:13px 16px;font-weight:700;font-size:16px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.primary:disabled{opacity:.5;cursor:not-allowed}
.empty{color:var(--ink-3);font-size:14px;padding:6px 0}
.form{display:grid;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--panel-2);padding:4px;border-radius:12px}
.seg button{background:transparent;color:var(--ink-2);padding:9px 4px;font-weight:500;border-radius:9px}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.note{font-size:13px;color:var(--ink-3)}
.warn{font-size:13px;color:var(--red);font-weight:500}
.applink{font-size:13px;color:var(--ink-2);text-align:center}
.applink a{font-weight:600}
.close-cart{display:none;background:var(--panel-2);color:var(--ink);width:34px;height:34px;border-radius:999px;font-size:18px}

/* mobile cart bar */
.cartbar{display:none}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:60}
.sheet{background:var(--panel);color:var(--ink);width:100%;max-width:620px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px 0;display:grid;gap:14px;box-shadow:var(--shadow)}
.sheet .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sheet h3{font-size:20px}
.sheet .x{background:var(--panel-2);color:var(--ink);border-radius:999px;width:34px;height:34px;font-size:18px;flex:0 0 auto}
.step{display:grid;gap:6px}
.step .label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
[data-lang="ar"] .step .label{letter-spacing:0;font-size:13px}
.step .hint{font-size:12px;color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{background:var(--panel-2);color:var(--ink);padding:8px 12px;border-radius:999px;font-weight:500}
.chips button[aria-pressed="true"]{background:var(--lime);color:var(--lime-ink);font-weight:600}
.sheet textarea{min-height:56px;background:var(--ground)}
.sheet .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;bottom:0;background:var(--panel);padding:12px 0 16px;border-top:1px solid var(--line)}
.sheet .foot .qty button{width:34px;height:34px;border-radius:999px;font-size:18px}
.sheet .foot .primary{width:auto;flex:1}
@media (min-width:720px){.sheet-bg{align-items:center}.sheet{border-radius:18px}}

.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:12px 18px;border-radius:12px;box-shadow:var(--shadow);z-index:80;font-weight:500;max-width:calc(100% - 32px)}
footer{max-width:1180px;margin:0 auto;padding:0 16px 40px;color:var(--ink-3);font-size:13px}

@media (max-width:900px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .cart{position:fixed;inset:auto 0 0 0;top:auto;max-height:88vh;border-radius:18px 18px 0 0;z-index:50;display:none}
  body.cart-open .cart{display:flex}
  body.cart-open::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:45}
  .close-cart{display:block}
  .cartbar{display:flex;position:fixed;left:12px;right:12px;bottom:12px;z-index:40;background:var(--lime);color:var(--lime-ink);border-radius:14px;padding:14px 16px;font-weight:700;font-size:16px;justify-content:space-between;align-items:center;box-shadow:var(--shadow)}
  body.cart-open .cartbar{display:none}
}
@media (max-width:420px){.two{grid-template-columns:1fr}.top .back{font-size:13px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>

  {id:'sahlab',name:'Sahlab',ar:'سحلب',price:2.5,desc:'Hot, cinnamon, coconut. Winter only.',descAr:'سخن، قرفة، جوز هند. بالشتي بس.'},

 {id:'drinks',name:'Drinks',ar:'مشروبات',items:[
  {id:'soft',name:'Soft drink',ar:'مشروب غازي',price:1.5,choices:[C('kind','Which','أيا واحد',[['Pepsi',0],['7Up',0],['Mirinda',0],['Diet Pepsi',0]])]},

];
const TAGS={sig:['Signature','مميّز'],new:['New','جديد'],lean:['Lean','خفيف'],kilo:['Kilo','كيلو'],fam:['Friday','الجمعة']};
const ZONE_FEE={A:t=>(t>=8?0:1),B:()=>2,C:()=>3};

/* ===== state ===== */
let lang='en',cart=[],orderType='delivery',pay='cash';
try{const s=localStorage.getItem('bcc-lang');if(s==='ar'||s==='en')lang=s;}catch(e){}
try{const c=JSON.parse(localStorage.getItem('bcc-grill-cart')||'[]');if(Array.isArray(c))cart=c;}catch(e){}
const $=s=>document.querySelector(s);
const t=k=>T[lang][k];
const opt=n=>lang==='ar'&&AR[n]?AR[n]:n;
const money=n=>'$'+(Math.round(n*100)/100).toFixed(Math.abs(n%1)>0.001?2:0);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2800);}
function saveCart(){try{localStorage.setItem('bcc-grill-cart',JSON.stringify(cart));}catch(e){}}
const findItem=id=>{for(const c of MENU)for(const it of c.items)if(it.id===id)return it;};

/* ===== language ===== */
function applyLang(){
  const r=document.documentElement;
  r.setAttribute('data-lang',lang);r.setAttribute('dir',lang==='ar'?'rtl':'ltr');r.setAttribute('lang',lang);
  $('#langbtn').textContent=lang==='ar'?'English':'عربي';
  document.querySelectorAll('[data-t]').forEach(e=>{const v=t(e.dataset.t);if(typeof v==='string')e.innerHTML=v;});
  document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));
  $('#appLink').href=APP_URL;
  renderMenu();renderCart();
}
$('#langbtn').onclick=()=>{lang=lang==='ar'?'en':'ar';try{localStorage.setItem('bcc-lang',lang);}catch(e){}applyLang();};

/* ===== menu ===== */
function renderMenu(){
  const cats=$('#cats'),menu=$('#menu');cats.innerHTML='';menu.innerHTML='';
  MENU.forEach((c,i)=>{
    const b=document.createElement('button');b.type='button';b.textContent=lang==='ar'?c.ar:c.name;b.setAttribute('aria-current',i===0?'true':'false');
    b.onclick=()=>document.getElementById('sec-'+c.id).scrollIntoView({block:'start'});
    cats.appendChild(b);
    const sec=document.createElement('section');sec.className='section';sec.id='sec-'+c.id;sec.dataset.i=i;
    sec.innerHTML=`<h2>${lang==='ar'?c.ar:c.name}${lang==='en'?`<small lang="ar">${c.ar}</small>`:''}</h2>`+((lang==='ar'?c.subAr:c.sub)?`<div class="sub">${lang==='ar'?c.subAr:c.sub}</div>`:'');
    const grid=document.createElement('div');grid.className='grid';
    c.items.forEach(it=>{
      const d=document.createElement('article');d.className='item'+(it.tag==='sig'||it.tag==='new'?' sig':'');
      const tg=it.tag?`<span class="tag ${it.tag==='lean'?'lean':''}">${TAGS[it.tag][lang==='ar'?1:0]}</span>`:'';
      const nm=lang==='ar'?it.ar:it.name, alt=lang==='ar'?it.name:it.ar, ds=lang==='ar'?(it.descAr||''):(it.desc||'');
      d.innerHTML=`<div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div><div class="name">${nm}</div><div class="alt" lang="${lang==='ar'?'en':'ar'}">${alt}</div></div>${tg}</div>
        ${ds?`<div class="desc">${ds}</div>`:''}${it.kcal?`<div class="kcal num">≈ ${it.kcal} ${t('kcal')}</div>`:''}
        <div class="row"><span class="price num">${money(it.price)}</span><button type="button" class="add">${it.choices?t('choose'):t('add')}</button></div>`;
      d.querySelector('.add').onclick=()=>openSheet(it);
      grid.appendChild(d);
    });
    sec.appendChild(grid);menu.appendChild(sec);
  });
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const i=+e.target.dataset.i;cats.querySelectorAll('button').forEach((b,j)=>b.setAttribute('aria-current',j===i?'true':'false'));const btn=cats.children[i];if(btn)cats.scrollTo({left:btn.offsetLeft-16,behavior:'smooth'});}}),{rootMargin:'-130px 0px -65% 0px'});
  menu.querySelectorAll('.section').forEach(s=>io.observe(s));
}

/* ===== customise sheet ===== */
function openSheet(it){
  const sel={qty:1,notes:'',addons:new Set(),pick:{}};
  (it.choices||[]).forEach(g=>{sel.pick[g.key]=g.multi?new Set(g.min?g.opts.slice(0,g.min).map(o=>o[0]):[]):g.opts[0][0];});
  const bg=document.createElement('div');bg.className='sheet-bg';
  const sheet=document.createElement('div');sheet.className='sheet';sheet.setAttribute('role','dialog');sheet.setAttribute('aria-modal','true');
  bg.appendChild(sheet);document.body.appendChild(bg);
  const close=()=>{bg.remove();document.removeEventListener('keydown',onKey);};
  const onKey=e=>{if(e.key==='Escape')close();};document.addEventListener('keydown',onKey);
  bg.onclick=e=>{if(e.target===bg)close();};
  const visible=g=>!g.when||(sel.pick[g.when]&&!/only/i.test(sel.pick[g.when]));
  const unit=()=>{let p=it.price;(it.choices||[]).forEach(g=>{if(!visible(g))return;const v=sel.pick[g.key];const a=n=>{const o=g.opts.find(x=>x[0]===n);if(o)p+=o[1];};if(v instanceof Set)v.forEach(a);else if(v)a(v);});sel.addons.forEach(n=>{const o=ADDONS.find(x=>x[0]===n);if(o)p+=o[1];});return p;};
  const row=(label,hint,opts,get,set,multi,max,base)=>{
    const st=document.createElement('div');st.className='step';st.innerHTML=`<div class="label">${label}</div>`+(hint?`<div class="hint">${hint}</div>`:'');
    const ch=document.createElement('div');ch.className='chips';
    opts.forEach(([n,x])=>{const b=document.createElement('button');b.type='button';b.textContent=opt(n)+(base!=null?` · ${money(base+x)}`:(x?` ${x>0?'+':'−'}$${Math.abs(x)}`:''));const cur=get();b.setAttribute('aria-pressed',multi?cur.has(n):cur===n);
      b.onclick=()=>{if(multi){if(cur.has(n))cur.delete(n);else if(!max||cur.size<max)cur.add(n);else toast(t('upTo')(max));}else set(n);draw();};ch.appendChild(b);});
    st.appendChild(ch);return st;
  };
  function draw(){
    const top=sheet.scrollTop;
    const nm=lang==='ar'?it.ar:it.name,alt=lang==='ar'?it.name:it.ar,ds=lang==='ar'?(it.descAr||''):(it.desc||'');
    sheet.innerHTML=`<div class="head"><div><h3>${nm}</h3><div class="alt" style="color:var(--ink-3)">${alt}</div>${ds?`<div style="color:var(--ink-2);font-size:13px;margin-top:4px">${ds}</div>`:''}</div><button type="button" class="x" aria-label="Close">×</button></div>`;
    sheet.querySelector('.x').onclick=close;
    (it.choices||[]).forEach(g=>{if(!visible(g))return;
      const hint=(lang==='ar'?g.hintAr:g.hint)||(g.min?t('pickN')(g.min):g.max?t('upTo')(g.max):g.optional?t('optional'):'');
      sheet.appendChild(row(lang==='ar'?g.ar:g.label,hint,g.opts,()=>sel.pick[g.key],v=>{sel.pick[g.key]=v;},g.multi,g.max,g.abs?it.price:null));});
    sheet.appendChild(row(t('addSides'),t('addSidesHint'),ADDONS,()=>sel.addons,null,true,null));
    const n=document.createElement('div');n.className='step';n.innerHTML=`<div class="label">${t('kitchenNotes')}</div><textarea placeholder="${esc(t('notesPh'))}">${esc(sel.notes)}</textarea>`;
    n.querySelector('textarea').oninput=e=>{sel.notes=e.target.value;};sheet.appendChild(n);
    const f=document.createElement('div');f.className='foot';
    f.innerHTML=`<div class="qty"><button type="button" aria-label="Less">−</button><b class="num">${sel.qty}</b><button type="button" aria-label="More">+</button></div><button type="button" class="primary"><span>${t('addToOrder')}</span><span class="num">${money(unit()*sel.qty)}</span></button>`;
    const [m,p]=f.querySelectorAll('.qty button');m.onclick=()=>{if(sel.qty>1){sel.qty--;draw();}};p.onclick=()=>{sel.qty++;draw();};
    f.querySelector('.primary').onclick=()=>{
      for(const g of it.choices||[]){if(visible(g)&&g.min&&sel.pick[g.key].size<g.min){toast(t('pickN')(g.min)+' · '+(lang==='ar'?g.ar:g.label));return;}}
      const picks=[];(it.choices||[]).forEach(g=>{if(!visible(g))return;const v=sel.pick[g.key];const vals=v instanceof Set?[...v]:(v?[v]:[]);if(vals.length)picks.push({k:g.msg||g.label.replace(/ \(.*\)$/,''),v:vals});});
      if(sel.addons.size)picks.push({k:'Extra',v:[...sel.addons]});
      cart.push({id:it.id,qty:sel.qty,unit:unit(),picks,notes:sel.notes.trim()});
      saveCart();renderCart();close();toast(t('added'));
    };
    sheet.appendChild(f);sheet.scrollTop=top;
  }
  draw();sheet.querySelector('.x').focus();
}

/* ===== cart ===== */
const subtotal=()=>cart.reduce((s,l)=>s+l.unit*l.qty,0);
const fee=()=>orderType==='delivery'?ZONE_FEE[$('#cZone').value](subtotal()):0;
function renderCart(){
  const lines=$('#lines');lines.innerHTML='';
  if(!cart.length)lines.innerHTML=`<div class="empty">${t('empty')}</div>`;
  cart.forEach((l,i)=>{const it=findItem(l.id);if(!it)return;
    const d=document.createElement('div');d.className='line';
    const det=l.picks.map(p=>p.v.map(opt).join(', ')).join(' · ')+(l.notes?' · “'+esc(l.notes)+'”':'');
    d.innerHTML=`<div><b>${lang==='ar'?it.ar:it.name}</b>${det?`<small>${det}</small>`:''}</div><div class="num" style="font-weight:600">${money(l.unit*l.qty)}</div>
      <div class="qty" style="grid-column:1/-1"><button type="button" aria-label="Less">−</button><b class="num">${l.qty}</b><button type="button" aria-label="More">+</button></div>`;
    const [m,p]=d.querySelectorAll('.qty button');
    m.onclick=()=>{l.qty--;if(l.qty<1)cart.splice(i,1);saveCart();renderCart();};p.onclick=()=>{l.qty++;saveCart();renderCart();};
    lines.appendChild(d);});
  const s=subtotal(),f=fee();
  $('#totals').innerHTML=cart.length?`<div><span>${t('subtotal')}</span><span class="num">${money(s)}</span></div>`+(orderType==='delivery'?`<div><span>${t('deliveryFee')}</span><span class="num">${f?money(f):t('free')}</span></div>`:'')+`<div class="grand"><span>${t('total')}</span><span class="num">${money(s+f)}</span></div>`:'';
  $('#sendBtn').disabled=!cart.length;
  const n=cart.reduce((a,l)=>a+l.qty,0);
  $('#cartbar').hidden=!n;$('#cbCount').textContent=t('view')+' · '+t('items')(n);$('#cbTotal').textContent=money(s+f);
}
function seg(id,attr,cb){$(id).querySelectorAll('button').forEach(b=>b.onclick=()=>{$(id).querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');cb(b.dataset[attr]);});}
seg('#typeSeg','type',v=>{orderType=v;$('#deliveryFields').hidden=v!=='delivery';renderCart();});
seg('#paySeg','pay',v=>{pay=v;});
$('#cZone').onchange=renderCart;
$('#cartbar').onclick=()=>document.body.classList.add('cart-open');
$('#closeCart').onclick=()=>document.body.classList.remove('cart-open');

/* ===== send on WhatsApp ===== */
$('#sendBtn').onclick=()=>{
  const w=$('#warn');w.hidden=true;
  const name=$('#cName').value.trim(),phone=$('#cPhone').value.trim(),addr=$('#cAddress').value.trim(),zone=$('#cZone').value;
  const bad=m=>{w.textContent=m;w.hidden=false;};
  if(!name||!phone)return bad(t('needName'));
  if(orderType==='delivery'&&!addr)return bad(t('needAddr'));
  if(orderType==='delivery'&&zone==='C'&&subtotal()<15)return bad(t('minC'));
  const zoneTxt={A:'Baissour',B:'Neighbouring village',C:'Down the road'}[zone];
  const L=['*BCC Grill order — website*','',(orderType==='delivery'?'Delivery':'Take away')+' · '+({cash:'Cash',whish:'Whish',omt:'OMT',card:'Card'}[pay]),'Name: '+name,'Phone: '+phone];
  if(orderType==='delivery')L.push('Area: '+zoneTxt,'Address: '+addr);
  L.push('');
  cart.forEach(l=>{const it=findItem(l.id);L.push(`${l.qty}× ${it.name} (${it.ar}) — ${money(l.unit*l.qty)}`);l.picks.forEach(p=>L.push(`   ${p.k}: ${p.v.join(', ')}`));if(l.notes)L.push('   Note: '+l.notes);});
  const s=subtotal(),f=fee();
  L.push('','Subtotal: '+money(s));if(orderType==='delivery')L.push('Delivery: '+(f?money(f):'Free'));L.push('*Total: '+money(s+f)+'*');
  const notes=$('#cNotes').value.trim();if(notes)L.push('','Kitchen notes: '+notes);
  window.open('https://wa.me/'+WHATSAPP+'?text='+encodeURIComponent(L.join('\n')),'_blank','noopener');
  toast(t('sent'));
};

applyLang();
</script>
